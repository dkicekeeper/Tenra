name: Assistant server

# The Cloudflare Worker behind the AI assistant (server/assistant, docs/plan-ai-assistant.md).
# Push: typecheck and unit tests. Manual run: deploy the Worker, or run the model eval.
#
# Repository secrets used by the manual jobs:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  deploy
#   ANTHROPIC_API_KEY, REVENUECAT_SECRET_KEY     uploaded to the Worker on deploy
#   ANTHROPIC_API_KEY                            eval

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "server/assistant/**"
      - ".github/workflows/assistant.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        type: choice
        options: [test, deploy, eval]
        default: test
      models:
        description: "eval: comma-separated model ids"
        default: "claude-haiku-5-5,claude-sonnet-5-5,claude-opus-5-5"
      effort:
        description: "eval: comma-separated effort levels"
        default: "low"
      cases:
        description: "eval: comma-separated case ids, or all"
        default: "all"

defaults:
  run:
    working-directory: server/assistant

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/assistant/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/assistant/package-lock.json
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server/assistant
          command: deploy
          secrets: |
            ANTHROPIC_API_KEY
            REVENUECAT_SECRET_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVENUECAT_SECRET_KEY: ${{ secrets.REVENUECAT_SECRET_KEY }}

  eval:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'eval'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/assistant/package-lock.json
      - run: npm ci
      - name: Run the eval (spends API credits)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODELS: ${{ inputs.models }}
          EFFORT: ${{ inputs.effort }}
          CASES: ${{ inputs.cases }}
        run: npm run eval -- --models "$MODELS" --effort "$EFFORT" --cases "$CASES" --yes
      - name: Summary
        if: always()
        run: cat eval/out/*/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-eval
          path: server/assistant/eval/out/
          retention-days: 14
