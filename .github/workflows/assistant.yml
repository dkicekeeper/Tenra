name: Assistant server

# The Cloudflare Worker behind the AI assistant (server/assistant, docs/domains/assistant.md).
# Push: typecheck and unit tests. Manual run: deploy the Worker, run the model eval, or run the
# valuation eval (eval/valuation.ts: live web search, about $0.04 a case on Haiku 5.5 and $0.14
# on Sonnet 5.5).
#
# Repository secrets used by the manual jobs:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  deploy
#   ANTHROPIC_API_KEY, REVENUECAT_SECRET_KEY     uploaded to the Worker on deploy
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID         optional, uploaded on deploy: feedback messages
#                                                (POST /v1/feedback) also go to that chat
#   ANTHROPIC_EVAL_API_KEY                       eval, eval-valuation: a key of the separate
#                                                "Tenra eval" workspace in the Anthropic Console,
#                                                with its own spend limit, so an eval never spends
#                                                the limit that keeps Ten talking (2026-11-06: a
#                                                release eval took the month to the limit and Ten
#                                                went silent for everyone). Without it the eval
#                                                jobs stop before calling the API.

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "server/assistant/**"
      - ".github/workflows/assistant.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        type: choice
        options: [test, deploy, eval, eval-valuation]
        default: test
      models:
        description: "eval, eval-valuation: comma-separated model ids (the valuation eval is usually claude-haiku-5-5,claude-sonnet-5-5)"
        default: "claude-haiku-5-5,claude-sonnet-5-5,claude-opus-5-5"
      effort:
        description: "eval: comma-separated effort levels"
        default: "low"
      cases:
        description: "eval, eval-valuation: comma-separated case ids, or all"
        default: "all"
      fallback:
        description: "eval-valuation: the model asked again when the first finds too few listings, or none"
        default: "none"
      repeat:
        description: "eval-valuation: how many times each case runs (the search results change between runs)"
        default: "1"

defaults:
  run:
    working-directory: server/assistant

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/assistant/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/assistant/package-lock.json
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server/assistant
          command: deploy
          secrets: |
            ANTHROPIC_API_KEY
            REVENUECAT_SECRET_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVENUECAT_SECRET_KEY: ${{ secrets.REVENUECAT_SECRET_KEY }}
      # Optional: with both repository secrets set, each feedback message (POST /v1/feedback)
      # also goes to the owner's Telegram chat. Without them feedback is only kept in KV.
      - name: Telegram secrets for feedback (optional)
        working-directory: server/assistant
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "No TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID repository secrets: feedback stays in KV only."
            exit 0
          fi
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN
          printf '%s' "$TELEGRAM_CHAT_ID" | npx wrangler secret put TELEGRAM_CHAT_ID

  eval:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'eval'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/assistant/package-lock.json
      - run: npm ci
      - name: Eval key
        env:
          ANTHROPIC_EVAL_API_KEY: ${{ secrets.ANTHROPIC_EVAL_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_EVAL_API_KEY" ]; then
            echo "::error::Add the ANTHROPIC_EVAL_API_KEY secret: a key of the separate 'Tenra eval' workspace (see the header of assistant.yml). The production key is not used for evals."
            exit 1
          fi
      - name: Run the eval (spends API credits)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_EVAL_API_KEY }}
          MODELS: ${{ inputs.models }}
          EFFORT: ${{ inputs.effort }}
          CASES: ${{ inputs.cases }}
        run: npm run eval -- --models "$MODELS" --effort "$EFFORT" --cases "$CASES" --yes
      - name: Summary
        if: always()
        run: cat eval/out/*/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-eval
          path: server/assistant/eval/out/
          retention-days: 14

  eval-valuation:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'eval-valuation'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/assistant/package-lock.json
      - run: npm ci
      - name: Eval key
        env:
          ANTHROPIC_EVAL_API_KEY: ${{ secrets.ANTHROPIC_EVAL_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_EVAL_API_KEY" ]; then
            echo "::error::Add the ANTHROPIC_EVAL_API_KEY secret: a key of the separate 'Tenra eval' workspace (see the header of assistant.yml). The production key is not used for evals."
            exit 1
          fi
      - name: Run the valuation eval (spends API credits and web searches)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_EVAL_API_KEY }}
          MODELS: ${{ inputs.models }}
          EFFORT: ${{ inputs.effort }}
          CASES: ${{ inputs.cases }}
          FALLBACK: ${{ inputs.fallback }}
          REPEAT: ${{ inputs.repeat }}
        run: npm run eval:valuation -- --models "$MODELS" --effort "$EFFORT" --cases "$CASES" --fallback "$FALLBACK" --repeat "$REPEAT" --yes
      - name: Summary
        if: always()
        run: cat eval/out/valuation-*/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valuation-eval
          path: server/assistant/eval/out/
          retention-days: 14
