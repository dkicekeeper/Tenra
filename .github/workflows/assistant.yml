name: Assistant server

# The Cloudflare Worker behind the AI assistant (server/assistant, docs/domains/assistant.md).
# Push: typecheck and unit tests. Manual run: deploy the Worker, run the model eval, or run the
# valuation eval (eval/valuation.ts: live web search, about $0.04 a case on Haiku 5.5 and $0.14
# on Sonnet 5.5).
#
# Repository secrets used by the manual jobs:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  deploy
#   ANTHROPIC_API_KEY, REVENUECAT_SECRET_KEY     uploaded to the Worker on deploy
#   TELEGRAM_BOT_TOKEN                           optional, uploaded on deploy: feedback messages
#                                                (POST /v1/feedback) also go to the owner's chat
#                                                with that bot. The chat is linked once: write
#                                                anything to the bot, then run "telegram-link"
#                                                (it stores the chat's id on the Worker).
#   TELEGRAM_CHAT_ID                             optional: a numeric chat id, uploaded on deploy
#                                                in place of the linked one
#   ANTHROPIC_EVAL_API_KEY                       eval, eval-valuation: a key of the separate
#                                                "Tenra eval" workspace in the Anthropic Console,
#                                                with its own spend limit, so an eval never spends
#                                                the limit that keeps Ten talking (2026-11-06: a
#                                                release eval took the month to the limit and Ten
#                                                went silent for everyone). Without it the eval
#                                                jobs stop before calling the API.

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "server/assistant/**"
      - ".github/workflows/assistant.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        type: choice
        options: [test, deploy, feedback-check, telegram-link, eval, eval-valuation]
        default: test
      models:
        description: "eval, eval-valuation: comma-separated model ids (the valuation eval is usually claude-haiku-5-5,claude-sonnet-5-5)"
        default: "claude-haiku-5-5,claude-sonnet-5-5,claude-opus-5-5"
      effort:
        description: "eval: comma-separated effort levels"
        default: "low"
      cases:
        description: "eval, eval-valuation: comma-separated case ids, or all"
        default: "all"
      fallback:
        description: "eval-valuation: the model asked again when the first finds too few listings, or none"
        default: "none"
      repeat:
        description: "eval-valuation: how many times each case runs (the search results change between runs)"
        default: "1"

defaults:
  run:
    working-directory: server/assistant

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/assistant/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/assistant/package-lock.json
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server/assistant
          command: deploy
          secrets: |
            ANTHROPIC_API_KEY
            REVENUECAT_SECRET_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVENUECAT_SECRET_KEY: ${{ secrets.REVENUECAT_SECRET_KEY }}
      # Optional: with both repository secrets set, each feedback message (POST /v1/feedback)
      # also goes to the owner's Telegram chat. Without them feedback is only kept in KV.
      - name: Telegram secrets for feedback (optional)
        working-directory: server/assistant
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "No TELEGRAM_BOT_TOKEN repository secret: feedback stays in KV only."
            exit 0
          fi
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN
          # Only a numeric id is a chat the bot can write to (a bot's own @name is not). Anything
          # else keeps the chat that "telegram-link" stored on the Worker.
          if printf '%s' "$TELEGRAM_CHAT_ID" | grep -Eq '^-?[0-9]+$'; then
            printf '%s' "$TELEGRAM_CHAT_ID" | npx wrangler secret put TELEGRAM_CHAT_ID
          else
            echo "TELEGRAM_CHAT_ID is not a numeric id: the linked chat stays."
          fi

  # Why does feedback not reach Telegram? Says how many messages the server holds and when the
  # last came (never their text: these logs are public), and sends a test line to the owner's
  # chat, printing Telegram's status and reason.
  feedback-check:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'feedback-check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/assistant/package-lock.json
      - run: npm ci
      - name: Messages kept on the server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler kv key list --binding QUOTA --prefix "feedback:" --remote > "$RUNNER_TEMP/keys.json"
          python3 - "$RUNNER_TEMP/keys.json" <<'PY'
          import json, sys
          names = sorted(k["name"] for k in json.load(open(sys.argv[1])))
          print("messages kept:", len(names))
          for name in names[-5:]:
              print("  at", name.split(":", 1)[1].rsplit(":", 1)[0])
          PY
      - name: A test line to the owner's Telegram chat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID repository secret is empty."
            exit 1
          fi
          python3 - <<'PY'
          import json, os, re, sys, urllib.error, urllib.request
          token, chat = os.environ["TELEGRAM_BOT_TOKEN"].strip(), os.environ["TELEGRAM_CHAT_ID"].strip()
          print("token looks like a bot token:", bool(re.fullmatch(r"\d+:[\w-]{30,}", token)))
          print("chat id is a number:", bool(re.fullmatch(r"-?\d+", chat)), "| starts with @:", chat.startswith("@"))
          print("secrets have stray spaces or newlines:",
                token != os.environ["TELEGRAM_BOT_TOKEN"] or chat != os.environ["TELEGRAM_CHAT_ID"])
          def call(method, payload=None):
              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/{method}",
                  data=json.dumps(payload).encode() if payload else None,
                  headers={"content-type": "application/json"})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  return error.code, json.load(error)
          status, body = call("getMe")
          print("getMe:", status, body.get("description", "ok"))
          status, body = call("sendMessage", {"chat_id": chat, "text": "Tenra: проверка канала обратной связи."})
          print("sendMessage:", status, body.get("description", "ok"))
          sys.exit(0 if status == 200 else 1)
          PY

  # Links the owner's chat to the feedback bot: takes the private chat that wrote to the bot last
  # (within Telegram's 24 hours), sends it a test line and stores its id as the Worker's
  # TELEGRAM_CHAT_ID. The id is never printed: these logs are public.
  telegram-link:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'telegram-link'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/assistant/package-lock.json
      - run: npm ci
      - name: Find the chat, test it, store it on the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - > "$RUNNER_TEMP/chat" <<'PY'
          import json, os, sys, urllib.error, urllib.request
          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          def call(method, payload=None):
              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/{method}",
                  data=json.dumps(payload).encode() if payload else None,
                  headers={"content-type": "application/json"})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  return error.code, json.load(error)
          status, body = call("getUpdates")
          if status != 200:
              sys.exit(f"getUpdates: {status} {body.get('description')}")
          chats = [u["message"]["chat"] for u in body["result"]
                   if u.get("message", {}).get("chat", {}).get("type") == "private"]
          print(f"updates: {len(body['result'])}, private chats: {len({c['id'] for c in chats})}", file=sys.stderr)
          if not chats:
              sys.exit("Nobody wrote to the bot in the last 24 hours: open the bot, press Start, write a word, run again.")
          chat = chats[-1]["id"]
          status, body = call("sendMessage", {"chat_id": chat, "text": "Tenra: этот чат получает обратную связь из приложения."})
          print("sendMessage:", status, body.get("description", "ok"), file=sys.stderr)
          if status != 200:
              sys.exit(1)
          print(chat, end="")
          PY
          npx wrangler secret put TELEGRAM_CHAT_ID < "$RUNNER_TEMP/chat"
          rm "$RUNNER_TEMP/chat"

  eval:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'eval'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/assistant/package-lock.json
      - run: npm ci
      - name: Eval key
        env:
          ANTHROPIC_EVAL_API_KEY: ${{ secrets.ANTHROPIC_EVAL_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_EVAL_API_KEY" ]; then
            echo "::error::Add the ANTHROPIC_EVAL_API_KEY secret: a key of the separate 'Tenra eval' workspace (see the header of assistant.yml). The production key is not used for evals."
            exit 1
          fi
      - name: Run the eval (spends API credits)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_EVAL_API_KEY }}
          MODELS: ${{ inputs.models }}
          EFFORT: ${{ inputs.effort }}
          CASES: ${{ inputs.cases }}
        run: npm run eval -- --models "$MODELS" --effort "$EFFORT" --cases "$CASES" --yes
      - name: Summary
        if: always()
        run: cat eval/out/*/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-eval
          path: server/assistant/eval/out/
          retention-days: 14

  eval-valuation:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'eval-valuation'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/assistant/package-lock.json
      - run: npm ci
      - name: Eval key
        env:
          ANTHROPIC_EVAL_API_KEY: ${{ secrets.ANTHROPIC_EVAL_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_EVAL_API_KEY" ]; then
            echo "::error::Add the ANTHROPIC_EVAL_API_KEY secret: a key of the separate 'Tenra eval' workspace (see the header of assistant.yml). The production key is not used for evals."
            exit 1
          fi
      - name: Run the valuation eval (spends API credits and web searches)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_EVAL_API_KEY }}
          MODELS: ${{ inputs.models }}
          EFFORT: ${{ inputs.effort }}
          CASES: ${{ inputs.cases }}
          FALLBACK: ${{ inputs.fallback }}
          REPEAT: ${{ inputs.repeat }}
        run: npm run eval:valuation -- --models "$MODELS" --effort "$EFFORT" --cases "$CASES" --fallback "$FALLBACK" --repeat "$REPEAT" --yes
      - name: Summary
        if: always()
        run: cat eval/out/valuation-*/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valuation-eval
          path: server/assistant/eval/out/
          retention-days: 14
