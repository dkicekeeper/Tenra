name: CI

on:
  push:
    # Working branches too, so a change is compiled before it reaches main.
    branches: [main, "claude/**"]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

jobs:
  # No literal colours, fonts, spacing, radii or animations outside DesignKit tokens.
  # Fails only on values beyond scripts/design-lint-baseline.json (CLAUDE.md, UI Components).
  design-lint:
    name: Design lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No raw design values beyond the baseline
        run: python3 scripts/design_lint.py

  build-and-test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The runner's newest stable Xcode (26.x until GitHub adds Xcode 27). iOS 27 SDK code
      # sits behind `#if compiler(>=6.4)`, so it compiles only where the SDK exists; a pinned
      # old Xcode here made every build fail once the app adopted iOS 27 APIs.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve simulator destination
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/^ *([^(]+) \(.*/\1/' | sed 's/ *$//')
          if [ -z "$DEVICE" ]; then echo "No iPhone simulator available"; exit 1; fi
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEVICE"

      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Tenra \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -only-testing:TenraTests \
            2>&1 | tee xcodebuild.log | grep -aE "Test case .* (passed|failed)|error:|\*\* TEST (SUCCEEDED|FAILED)" || true
          grep -aq "\*\* TEST SUCCEEDED \*\*" xcodebuild.log

      # swift-testing's failed expectations reach only the result bundle, not the
      # xcodebuild log: print every failure message with its test so a red run says why.
      - name: Failing test details
        if: failure()
        run: |
          RESULT=$(grep -aoE "/[^[:space:]]+\.xcresult" xcodebuild.log | tail -1)
          if [ -z "$RESULT" ]; then echo "No result bundle in the log"; exit 0; fi
          xcrun xcresulttool get test-results tests --path "$RESULT" > tests.json || exit 0
          python3 - <<'EOF'
          import json

          def walk(node, test):
              kind = node.get("nodeType", "")
              name = node.get("name", "")
              if kind == "Test Case":
                  test = name
                  if node.get("result") == "Failed":
                      print(f"FAILED {name}")
              if kind == "Failure Message":
                  print(f"  {test}: {name}")
              for child in node.get("children", []):
                  walk(child, test)

          for node in json.load(open("tests.json")).get("testNodes", []):
              walk(node, "")
          EOF

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
