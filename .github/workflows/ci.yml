name: CI

on:
  push:
    # Working branches too, so a change is compiled before it reaches main.
    branches: [main, "claude/**"]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'server/**' # the assistant Worker has its own workflow (assistant.yml)
  workflow_dispatch:

jobs:
  # No literal colours, fonts, spacing, radii or animations outside DesignKit tokens.
  # Fails only on values beyond scripts/design-lint-baseline.json (CLAUDE.md, UI Components).
  design-lint:
    name: Design lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No raw design values beyond the baseline
        run: python3 scripts/design_lint.py
      # Every row of a glass section pads itself and keeps its divider under its text
      # (DesignKit 8.1.0; CLAUDE.md, UI Components).
      - name: Rows of glass sections
        run: python3 scripts/section_rows_lint.py

  build-and-test:
    # GitHub's Xcode 27 image (public preview since 2026-10, macOS 27): the iOS 27 SDK, so the
    # code behind `#if compiler(>=6.4)` is compiled and tested too. Xcode pinned to the image's
    # release, not `latest-stable`, which could pick its release candidate; raise it with the
    # Mac's Xcode, in every workflow at once (docs/asc.md).
    runs-on: xcode-27
    # About twice macos-26's time: some 20 minutes to build, 20 to test, more when a simulator
    # clone freezes (CLAUDE.md, Testing).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # An iPhone on the newest iOS runtime, by id: since Xcode 27 a bare `name=` destination
      # means the newest OS, and a model missing from it is "not found".
      - name: Resolve simulator destination
        id: sim
        run: |
          xcrun simctl list devices available -j > simulators.json
          SIM=$(python3 -c '
          import json, re
          best = None
          for runtime, devices in json.load(open("simulators.json"))["devices"].items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              phones = [d for d in devices if d["name"].startswith("iPhone")]
              if m and phones:
                  version = (int(m.group(1)), int(m.group(2)))
                  if best is None or version > best[0]:
                      best = (version, phones[0])
          if best:
              print(best[1]["udid"], "%s, iOS %d.%d" % (best[1]["name"], *best[0]))
          ')
          if [ -z "$SIM" ]; then echo "::error::No iPhone simulator available"; exit 1; fi
          echo "id=${SIM%% *}" >> "$GITHUB_OUTPUT"
          echo "Using simulator: ${SIM#* }"

      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Tenra \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -only-testing:TenraTests \
            2>&1 | tee xcodebuild.log | grep -aE "Test case .* (passed|failed)|error:|\*\* TEST (SUCCEEDED|FAILED)" || true
          grep -aq "\*\* TEST SUCCEEDED \*\*" xcodebuild.log

      # swift-testing's failed expectations reach only the result bundle, not the
      # xcodebuild log: print every failure message with its test so a red run says why.
      - name: Failing test details
        if: failure()
        run: |
          RESULT=$(grep -aoE "/[^[:space:]]+\.xcresult" xcodebuild.log | tail -1)
          if [ -z "$RESULT" ]; then echo "No result bundle in the log"; exit 0; fi
          xcrun xcresulttool get test-results tests --path "$RESULT" > tests.json || exit 0
          python3 - <<'EOF'
          import json

          def walk(node, test):
              kind = node.get("nodeType", "")
              name = node.get("name", "")
              if kind == "Test Case":
                  test = name
                  if node.get("result") == "Failed":
                      print(f"FAILED {name}")
              if kind == "Failure Message":
                  print(f"  {test}: {name}")
              for child in node.get("children", []):
                  walk(child, test)

          for node in json.load(open("tests.json")).get("testNodes", []):
              walk(node, "")
          EOF

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
