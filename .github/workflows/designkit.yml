name: DesignKit update

# Keeps the design system current. Once a day (and on demand) it looks up the latest DesignKit
# release (tag X.Y.Z in github.com/dkicekeeper/DesignKit). When it is newer than the version
# pinned in Tenra.xcodeproj, it bumps the pin, re-resolves Package.resolved, builds the app and
# runs TenraTests (same as CI), and if everything is green commits the bump to main.
#
# DesignKit releases are already checked against the consumers that DesignKit's own CI builds,
# and a red build here leaves main untouched (the log says why). No token needed: this
# repository's GITHUB_TOKEN (contents: write) is enough.
#
# Visual changes to shared components are listed in the DesignKit release notes linked from
# the commit message.
on:
  schedule:
    - cron: "23 3 * * *" # 03:23 UTC, 08:23 in Almaty
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: designkit-update
  cancel-in-progress: false

env:
  PBXPROJ: Tenra.xcodeproj/project.pbxproj
  RESOLVED: Tenra.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

jobs:
  check:
    name: Newer DesignKit?
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.versions.outputs.current }}
      latest: ${{ steps.versions.outputs.latest }}
      update: ${{ steps.versions.outputs.update }}
    steps:
      - uses: actions/checkout@v4

      - id: versions
        run: |
          # The `version = X.Y.Z;` line inside the DesignKit package reference block.
          CURRENT=$(awk '/XCRemoteSwiftPackageReference "DesignKit" \*\/ = \{/,/^\t\t\};/' "$PBXPROJ" \
            | sed -nE 's/.*[^A-Za-z]version = "?([0-9]+\.[0-9]+\.[0-9]+)"?;.*/\1/p')
          LATEST=$(git ls-remote --tags --refs https://github.com/dkicekeeper/DesignKit \
            | sed -E 's#.*refs/tags/##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ -z "$CURRENT" ]; then
            echo "::error::$PBXPROJ has no DesignKit dependency pinned to an exact version (kind = exactVersion)"
            exit 1
          fi
          if [ -n "$LATEST" ] && [ "$LATEST" != "$CURRENT" ] \
             && [ "$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | tail -1)" = "$LATEST" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "DesignKit $CURRENT → $LATEST" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "DesignKit $CURRENT is the latest release" >> "$GITHUB_STEP_SUMMARY"
          fi

  update:
    name: Build and commit DesignKit ${{ needs.check.outputs.latest }}
    needs: check
    if: needs.check.outputs.update == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CURRENT: ${{ needs.check.outputs.current }}
      LATEST: ${{ needs.check.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for git pull --rebase before pushing to main

      - name: Bump the version
        run: |
          # Only inside the DesignKit block, so another package pinned to the same version
          # is never touched.
          perl -0pi -e 's/(XCRemoteSwiftPackageReference "DesignKit" \*\/ = \{.*?version = "?)\Q$ENV{CURRENT}\E("?;)/${1}$ENV{LATEST}${2}/s' "$PBXPROJ"
          git diff --stat
          grep -q "version = \"\?$LATEST\"\?;" "$PBXPROJ"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies -project Tenra.xcodeproj -scheme Tenra
          grep -A6 '"designkit"' "$RESOLVED"

      - name: Resolve simulator destination
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/^ *([^(]+) \(.*/\1/' | sed 's/ *$//')
          if [ -z "$DEVICE" ]; then echo "No iPhone simulator available"; exit 1; fi
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Tenra \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -only-testing:TenraTests \
            2>&1 | tee xcodebuild.log | grep -aE "Test case .* (passed|failed)|error:|\*\* TEST (SUCCEEDED|FAILED)" || true
          grep -aq "\*\* TEST SUCCEEDED \*\*" xcodebuild.log

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PBXPROJ" "$RESOLVED"
          git commit -m "chore(deps): update DesignKit to $LATEST" \
            -m "Automatic update (workflow DesignKit update): Tenra builds and TenraTests pass with DesignKit $LATEST. Release notes: https://github.com/dkicekeeper/DesignKit/releases/tag/$LATEST"
          # main may have moved during the build; replay on top, a conflict stops here.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          echo "::error::Could not push the update to main (conflict or race). Bump the version by hand."
          exit 1
