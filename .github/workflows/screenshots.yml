name: Screenshots

# Raw App Store screenshots on a GitHub macOS runner, so no Mac is needed: runs
# scripts/capture_screenshots.sh (TenraUITests/ScreenshotCaptureTests with the ScreenshotDemo
# dataset) for the chosen storefront locales and uploads screenshots/raw/<locale>/ as the
# "raw-screenshots" artifact (only the captured locales). scripts/compose_screenshots.py then composes the store frames.
# Run: Actions → Screenshots → Run workflow, or Claude through the GitHub API.

on:
  workflow_dispatch:
    inputs:
      locales:
        description: "ASC locales, space-separated (as in capture_screenshots.sh)"
        required: false
        default: "ru en-US fr-FR"
      frames:
        description: "all (01-19), cpp (only 09-12, the custom product page frames) or ten (only Ten's 07, 13, 14, 17-19)"
        required: false
        default: cpp
      art:
        description: "Also draw Ten's still pictures for the store's header and search art (art/ in the artifact)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: screenshots
  cancel-in-progress: false

jobs:
  capture:
    # Xcode 27, as CI and TestFlight (ci.yml explains the pin).
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"

      - name: Simulator
        id: sim
        run: |
          xcodebuild -version
          # The Xcode 27 image has no iPhone 17 Pro (its iOS 27 devices are the 17, 17e, Air and
          # 18 Pro): make one on the newest iOS runtime, so the store shots keep their device.
          if ! xcrun simctl list devices available | grep -q "iPhone 17 Pro ("; then
            RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c '
          import json, sys
          ios = [r for r in json.load(sys.stdin)["runtimes"] if ".iOS-" in r["identifier"]]
          if ios:
              print(max(ios, key=lambda r: [int(x) for x in r["version"].split(".")])["identifier"])
          ')
            if [ -z "$RUNTIME" ]; then echo "::error::No iOS simulator runtime on this runner"; exit 1; fi
            xcrun simctl create "iPhone 17 Pro" "iPhone 17 Pro" "$RUNTIME"
          fi
          # The newest runtime that has an iPhone 17 Pro (the store shots' device).
          SIM_OS=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          found = []
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if m and any(d["name"] == "iPhone 17 Pro" for d in devices):
                  found.append((int(m.group(1)), int(m.group(2))))
          if found:
              major, minor = max(found)
              print(f"{major}.{minor}")
          ')
          if [ -z "$SIM_OS" ]; then echo "::error::No iPhone 17 Pro simulator on this runner"; exit 1; fi
          echo "os=$SIM_OS" >> "$GITHUB_OUTPUT"
          echo "iPhone 17 Pro, iOS $SIM_OS"

      - name: Capture
        env:
          SIM_NAME: iPhone 17 Pro
          SIM_OS: ${{ steps.sim.outputs.os }}
          LOCALES: ${{ inputs.locales }}
          FRAMES: ${{ inputs.frames }}
        run: |
          mkdir -p build/raw-out
          status=0
          for locale in $LOCALES; do
            ONLY="$locale" ./scripts/capture_screenshots.sh || status=1
            cp -R "screenshots/raw/$locale" build/raw-out/ || true
          done
          find build/raw-out -name '*.png' | sort
          exit $status

      # Ten's stills (TenraTests/Views/StoreArtRenderTests) for scripts/compose_store_art.py.
      - name: Ten for the store art
        if: ${{ always() && inputs.art }}
        env:
          SIM_NAME: iPhone 17 Pro
          SIM_OS: ${{ steps.sim.outputs.os }}
        run: |
          mkdir -p build/raw-out/art
          TEST_RUNNER_STORE_ART_DIR="$PWD/build/raw-out/art" xcodebuild test \
            -scheme Tenra \
            -destination "platform=iOS Simulator,name=$SIM_NAME,OS=$SIM_OS" \
            -only-testing:TenraTests/StoreArtRenderTests \
            -parallel-testing-enabled NO \
            2>&1 | grep -aE "Test case .* (passed|failed)|\*\* TEST (SUCCEEDED|FAILED)|error:" | head -20
          ls -la build/raw-out/art
          test -n "$(ls build/raw-out/art)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-screenshots
          path: build/raw-out
          if-no-files-found: warn
