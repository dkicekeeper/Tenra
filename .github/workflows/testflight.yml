name: TestFlight

# Archives the app and uploads it to App Store Connect, from where it lands in TestFlight.
# On demand only: Actions → TestFlight → Run workflow (pick the branch), or Claude triggers it
# through the GitHub API. Nothing runs on push, because every run spends a build number.
# A second job waits until App Store Connect has processed the build and puts the builds table
# in the run's summary (appstore/asc.py wait-build), so the run says whether TestFlight got it.
#
# Signing is Xcode's automatic signing driven by an App Store Connect API key, so no
# certificate or provisioning profile lives in the repository:
#   - archive: `-allowProvisioningUpdates` lets xcodebuild fetch (or create) the development
#     certificate and profile this fresh runner needs;
#   - export: cloud signing with the team's cloud-managed distribution certificate.
# Both need a key with the Admin role.
#
# Repository secrets (Settings → Secrets and variables → Actions → New repository secret):
#   ASC_KEY_ID      Key ID of the App Store Connect API key
#   ASC_ISSUER_ID   Issuer ID shown above the key list in App Store Connect
#   ASC_KEY_P8      the full text of the downloaded AuthKey_<KeyID>.p8, BEGIN/END lines included
#
# Xcode: the runner's newest stable one. GitHub's macOS runners stop at Xcode 26.x for now,
# and iOS 27 code sits behind `#if compiler(>=6.4)`, so a build from here has none of the
# iOS 27-only UI until GitHub adds Xcode 27. The job summary says which Xcode built it.
# App Store release builds keep coming from a Mac with Xcode 27 until then.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (CFBundleVersion). Empty = 1 + this workflow's run number."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      build: ${{ steps.version.outputs.build }}
      version: ${{ steps.version.outputs.version }}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: SY2L2VMQP7
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::Add the ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 repository secrets (see the header of testflight.yml)."
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Version and build number
        id: version
        env:
          INPUT_BUILD: ${{ inputs.build_number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # +1 leaves build 1 of a new version free for a manual upload from Xcode.
          BUILD="${INPUT_BUILD:-$((RUN_NUMBER + 1))}"
          if ! [[ "$BUILD" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Build number '$BUILD' must be one to three dot-separated integers."
            exit 1
          fi
          VERSION=$(sed -nE 's/.*MARKETING_VERSION = ([0-9.]+);.*/\1/p' Tenra.xcodeproj/project.pbxproj | head -1)
          XCODE=$(xcodebuild -version | head -1)
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "### Tenra $VERSION ($BUILD)"
            echo "- Commit: \`${GITHUB_SHA::7}\` on \`$GITHUB_REF_NAME\`"
            echo "- $XCODE"
            if [[ "$XCODE" =~ Xcode\ 2[0-6]\. ]]; then
              echo "- ⚠️ Built without the iOS 27 SDK: iOS 27-only UI is compiled out of this build."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Tenra $VERSION ($BUILD) with $XCODE"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Tenra.xcodeproj \
            -scheme Tenra \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Tenra.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            2>&1 | tee archive.log | grep -aE "error:|\*\* ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -aq "\*\* ARCHIVE SUCCEEDED \*\*" archive.log

      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Tenra.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log | grep -aE "error:|Upload|\*\* EXPORT (SUCCEEDED|FAILED)" || true
          grep -aq "\*\* EXPORT SUCCEEDED \*\*" export.log
          echo "- Uploaded. TestFlight shows it after Apple finishes processing (usually 10-30 min)." >> "$GITHUB_STEP_SUMMARY"

      # The job log is public-readable, the artifacts are not: the tail goes to the log so a
      # failed signing step can be diagnosed without downloading anything.
      - name: Log tail on failure
        if: failure()
        run: |
          for f in archive.log export.log; do
            [ -f "$f" ] && { echo "===== $f"; tail -120 "$f"; }
          done
          exit 0

  # On a Linux runner: waiting on Apple's processing (10-30 min) shouldn't hold the macOS one.
  processing:
    name: Wait for App Store Connect processing
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD: ${{ needs.upload.outputs.build }}
          VERSION: ${{ needs.upload.outputs.version }}
        run: |
          python3 -m venv "$RUNNER_TEMP/ascenv"
          "$RUNNER_TEMP/ascenv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/ascenv/bin/python" appstore/asc.py wait-build --build "$BUILD" --version "$VERSION" --wait 40
