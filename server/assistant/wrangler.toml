name = "tenra-assistant"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# No request bodies or responses are logged. Workers observability keeps only
# the metadata Cloudflare records itself (status, duration, colo).
[observability]
enabled = true
head_sampling_rate = 1

[vars]
# Off switch: "false" makes every turn answer 503 `disabled` without calling Anthropic.
ASSISTANT_ENABLED = "true"
# Production model, chosen by the eval (docs/domains/assistant.md §11): on 2026-10-14 Haiku 5.5
# passed 25/25 like Sonnet and Opus at about 1/37 of Opus's cost.
ASSISTANT_MODEL = "claude-haiku-5-5"
ASSISTANT_EFFORT = "low"
ASSISTANT_MAX_TOKENS = "16000"
# Model calls per user per calendar month (UTC). One user message is about 2-3 calls.
PRO_MONTHLY_CALLS = "900"
# Without Pro, per App Attest key (one install) per month. The app's own allowance is 30
# answers in the first week, then 10 a month; about 3 calls an answer, plus headroom.
FREE_MONTHLY_CALLS = "150"
# Circuit breaker on total spend: model calls per day across all users. Sized to the Anthropic
# workspace's monthly limit ($50 during the ads): a call costs about $0.0014 on Haiku (§11 of
# docs/domains/assistant.md), so 1 200 calls is about $1.7, a 30th of the limit. A busy day
# silences Ten until midnight UTC instead of the limit silencing it for the rest of the month.
# Expected with ads at $10 a day: about 100 calls a day. Raise it with the limit (limit × 24).
GLOBAL_DAILY_CALLS = "1200"
# Free callers' share of that day (src/quota.ts): free calls stop at it, so the 300 calls above
# it stay for Pro customers and trials (about 100 messages) however many free users the ads
# bring. Keep it at about three quarters of GLOBAL_DAILY_CALLS when raising the two.
FREE_DAILY_CALLS = "900"
# Countries not served by the Anthropic API (anthropic.com/supported-countries).
BLOCKED_COUNTRIES = "RU,BY"
# The app App Attest assertions must come from: Team ID + bundle id.
APP_ID = "SY2L2VMQP7.dakacom.Tenra"
# POST /v1/valuation, an asset's value from comparable listings found by web search
# (src/valuation.ts, docs/plan-assets-roadmap.md §3), with its line in the privacy policy. On
# since 2026-11-03 (the owner's decision): builds 68 and later call it.
VALUATION_ENABLED = "true"
# Chosen by the valuation eval (eval/valuation.ts), apart from the chat's model: Haiku first,
# Sonnet again when Haiku finds too few listings or declines (about a quarter of valuations).
VALUATION_MODEL = "claude-haiku-5-5"
VALUATION_FALLBACK_MODEL = "claude-sonnet-5-5"
VALUATION_EFFORT = "low"
# Web searches per valuation, $0.01 each.
VALUATION_MAX_SEARCHES = "3"
# Valuations a month: per App Attest key without Pro, per customer with it. Pro only, 10 a month
# (the owner's decision, 2026-11-03): without Pro the chat has no estimate_asset_value either.
FREE_MONTHLY_VALUATIONS = "0"
PRO_MONTHLY_VALUATIONS = "10"
# A valuation counts as this many calls in GLOBAL_DAILY_CALLS: Haiku's searches and results cost
# about $0.025, the Sonnet fallback $0.15 a quarter of the time, some $0.06 on average, about 40
# chat calls.
VALUATION_CALL_WEIGHT = "40"

# The KV namespace `tenra-assistant-quota` (Cloudflare → Storage & databases → Workers KV).
[[kv_namespaces]]
binding = "QUOTA"
id = "c509b91968924c0b96deba4ebd1ea187"

# Secrets (never in this file): `npx wrangler secret put ANTHROPIC_API_KEY`
# and `npx wrangler secret put REVENUECAT_SECRET_KEY`.
